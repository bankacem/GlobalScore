name: Refresh football data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-football-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Pages branch
        uses: actions/checkout@v4
        with:
          ref: feature/globalscore-phase1-foundation-6374903721955978638

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fixtures and player headlines
        run: python scripts/update_data.py

      - name: Generate today and tomorrow articles
        run: python scripts/generate_multilingual_articles.py

      - name: Commit the refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ar en fr es assets/data/content.json assets/data/live.json Sitemap.xml sitemap.xml sitemap-index.xml
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh football data and articles"
            git push origin HEAD:feature/globalscore-phase1-foundation-6374903721955978638
          fi
